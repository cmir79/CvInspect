name: publish

# 태그를 밀면 nuget.org 에 올린다. 손으로 다시 돌릴 수도 있게 둔다 —
# 올리기가 실패했을 때 태그를 다시 만들지 않고 같은 판을 재시도하려는 것이다.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

jobs:
  publish:
    # Windows 인 이유: CvInspect.Wpf 가 net8.0-windows 라 다른 곳에서는 pack 이 안 되고,
    # 올리기 전에 돌리는 회귀에 Wpf 오프스크린 묶음이 들어 있다.
    runs-on: windows-latest
    permissions:
      # OIDC 토큰을 받으려면 이것이 필요하다. nuget.org 는 그 토큰을 확인하고 한 시간짜리 열쇠를 내준다 —
      # 그래서 저장해 둘 열쇠가 없다.
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 8.0.x

      # 태그와 판 번호가 어긋난 채로 올라가는 것을 막는다. nuget.org 는 한 번 올린 번호를 지울 수도, 덮어쓸
      # 수도 없으므로 여기서 걸러야 한다. 락스텝이라 판 번호는 Directory.Build.props 한 곳뿐이다.
      - name: Check the tag matches the version
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          tag="${GITHUB_REF_NAME#v}"
          version=$(grep -oPm1 '(?<=<Version>)[^<]+' Directory.Build.props)
          echo "tag=$tag  Directory.Build.props=$version"
          if [ "$tag" != "$version" ]; then
            echo "::error::tag v$tag does not match <Version>$version</Version>"
            exit 1
          fi

      - name: Build (all projects, all TFMs)
        run: dotnet build -c Release

      # 빨간 판을 올리지 않는다. 올린 뒤에는 되돌릴 방법이 없다.
      - name: Test (core + WPF off-screen)
        timeout-minutes: 10
        run: dotnet test --no-build -c Release

      # sln 전체를 pack 한다 — 패키지 넷은 IsPackable 기본값, 테스트·샘플은 IsPackable=false 라 빠진다.
      - name: Pack
        run: dotnet pack -c Release --no-build -o out

      - uses: actions/upload-artifact@v5
        with:
          name: nupkg
          path: out/*.nupkg

      # 열쇠는 쓰기 직전에 받는다. 한 시간이면 만료되므로 미리 받아 두면 밀 때 이미 죽어 있을 수 있다.
      # user 는 nuget.org 프로필 이름이다 — 메일 주소가 아니다.
      - name: NuGet login
        id: login
        uses: NuGet/login@v1
        with:
          user: kintaein

      # 같은 번호를 다시 밀어도 실패로 끝내지 않는다. 판 번호가 틀린 경우는 위에서 이미 걸렀으므로,
      # 여기서 걸리는 것은 같은 판을 다시 돌린 경우뿐이다.
      - name: Push
        shell: bash
        run: >
          dotnet nuget push out/*.nupkg
          --api-key ${{ steps.login.outputs.NUGET_API_KEY }}
          --source https://api.nuget.org/v3/index.json
          --skip-duplicate
