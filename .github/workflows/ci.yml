name: ci

on:
  push:
    branches: [main, dev]
  pull_request:
  # 손으로 다시 돌릴 수 있게 — 결과만 보고 싶을 때 빈 커밋을 만들지 않으려고.
  workflow_dispatch:

# Avalonia 빌드 도구(Avalonia.BuildServices)의 빌드 통계 전송을 끈다 — 값은 무엇이든 된다.
env:
  AVALONIA_TELEMETRY_OPTOUT: 1

# 연달아 밀어 넣으면 마지막 것만 돌린다. 브랜치별로 묶으므로 main 과 PR 은 서로 취소하지 않는다.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # 솔루션 전체가 서는 곳은 Windows 뿐이다 — CvInspect.Wpf 와 그 오프스크린 렌더 스위트가 net8.0-windows 다.
  # 그래서 "전부 빌드하고 전부 돌려 보는" 검사는 여기 하나로 모은다.
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 8.0.x
      - name: Build (all projects, all TFMs)
        run: dotnet build -c Release
      - name: Test
        timeout-minutes: 10
        run: dotnet test --no-build -c Release --logger trx --results-directory TestResults
      # xunit v2 스위트와 v3 스위트(Avalonia 헤드리스)가 한 번의 솔루션 시험에 섞인다 — v3 쪽이 발견되지 않아도 시험 단계는 초록이다
      # (0건은 실패가 아니다). 결과 파일에 그 스위트의 시험이 실제로 있는지 센다.
      - name: Check the Avalonia headless suite was counted
        shell: bash
        run: |
          # 러너 bash 는 -e·pipefail 이라 0건이면 grep 의 종료 값으로 아래 안내 줄 없이 멈춘다 — || true 로 받아 건수로 판정한다.
          n=$(grep -ho 'testName="CvInspect.Avalonia.Tests\.[^"]*"' TestResults/*.trx | wc -l || true)
          echo "CvInspect.Avalonia.Tests results in the solution run: $n"
          [ "$n" -gt 0 ] || { echo "the solution-wide test run did not include CvInspect.Avalonia.Tests"; exit 1; }
      - uses: actions/upload-artifact@v5
        if: always()
        with:
          name: test-results
          path: TestResults/**/*.trx
      # 패키지가 실제로 만들어지는 것까지 본다. 게시는 하지 않는다 — 산출물만 남긴다.
      - name: Pack
        run: dotnet pack --no-build -c Release -o out
      - uses: actions/upload-artifact@v5
        with:
          name: nupkg
          path: out/*.nupkg

  # Windows 밖에서도 컴파일되고 실행된다는 계약의 검사 — 유니티(netstandard2.1)와 Linux 소비자가 받는 자산이다.
  # 패키지 셋은 모든 TFM 을 빌드하고(테스트 프로젝트 참조만으로는 net8.0 한 벌만 선다), 코어 스위트는
  # OpenCvSharp4.official.runtime.linux-x64 를 물고 실제로 돈다. Avalonia 헤드리스 스위트도 여기서 돈다(Skia 그리기 — 창·GPU 없음).
  # WPF 스위트만 Windows 잡에 남는다.
  portable:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 8.0.x
      - name: Build (platform-neutral packages, all TFMs)
        run: |
          dotnet build src/CvInspect/CvInspect.csproj -c Release
          dotnet build src/CvInspect.Imaging/CvInspect.Imaging.csproj -c Release
          dotnet build src/CvInspect.Imaging.Gev/CvInspect.Imaging.Gev.csproj -c Release
          dotnet build src/CvInspect.Avalonia/CvInspect.Avalonia.csproj -c Release
      - name: Build the core suite
        run: dotnet build tests/CvInspect.Tests/CvInspect.Tests.csproj -c Release
      - name: Build the Avalonia headless suite
        run: dotnet build tests/CvInspect.Avalonia.Tests/CvInspect.Avalonia.Tests.csproj -c Release
      # 네이티브가 못 뜨면 테스트는 "DllNotFoundException" 한 줄만 남긴다 — 어느 .so 가 빠졌는지는 ldd 가 말해 준다.
      # Skia 는 시스템의 libfontconfig.so.1 을 문다(ELF 의존). 러너 이미지 목록에는 없어 없으면 깔고 다시 본다 — 그래도 빠지면 멈춘다.
      # 경로를 못 찾은 것도 실패다 — 빈 경로에 ldd 를 걸면 "not found" 가 안 나와 검사가 통과한 것처럼 보인다.
      - name: Native runtime dependencies
        run: |
          so=$(find ~/.nuget/packages/opencvsharp4.official.runtime.linux-x64 -name 'libOpenCvSharpExtern.so' | head -1)
          echo "$so"
          ldd "$so" | grep -i 'not found' && exit 1 || echo "all native dependencies resolved"
          skia=$(find ~/.nuget/packages/skiasharp.nativeassets.linux -path '*/linux-x64/native/libSkiaSharp.so' | head -1)
          hb=$(find ~/.nuget/packages/harfbuzzsharp.nativeassets.linux -path '*/linux-x64/native/libHarfBuzzSharp.so' | head -1)
          echo "$skia"
          echo "$hb"
          [ -n "$skia" ] && [ -n "$hb" ] || { echo "Skia/HarfBuzz native library not found in the package cache"; exit 1; }
          if ldd "$skia" | grep -i 'not found'; then
            echo "installing libfontconfig1 for libSkiaSharp.so"
            sudo apt-get update
            sudo apt-get install -y libfontconfig1
            ldd "$skia" | grep -i 'not found' && exit 1
          fi
          ldd "$hb" | grep -i 'not found' && exit 1 || echo "Skia and HarfBuzz native dependencies resolved"
      - name: Test (core suite)
        timeout-minutes: 10
        run: dotnet test tests/CvInspect.Tests/CvInspect.Tests.csproj --no-build -c Release --logger trx --results-directory TestResults
      # 단언 기록(CVI_CHECK_LOG) — 통과한 단언의 잰 값까지 남겨 Linux 글꼴·래스터에서 픽셀 임계값을 다시 정할 근거로 올린다.
      # 시험이 0건 돌아도 시험 단계는 초록이다 — 결과 파일에 그 스위트의 시험이 실제로 있는지 센다.
      - name: Test (Avalonia headless suite)
        timeout-minutes: 10
        env:
          CVI_CHECK_LOG: ${{ github.workspace }}/TestResults/avalonia-checks-linux.log
        run: |
          mkdir -p TestResults
          dotnet test tests/CvInspect.Avalonia.Tests/CvInspect.Avalonia.Tests.csproj --no-build -c Release --logger "trx;LogFileName=avalonia-linux.trx" --results-directory TestResults
          n=$(grep -o 'testName="CvInspect.Avalonia.Tests\.[^"]*"' TestResults/avalonia-linux.trx | wc -l || true)
          echo "CvInspect.Avalonia.Tests results: $n"
          [ "$n" -gt 0 ] || { echo "no CvInspect.Avalonia.Tests result in the trx"; exit 1; }
      - uses: actions/upload-artifact@v5
        if: always()
        with:
          name: test-results-linux
          path: |
            TestResults/**/*.trx
            TestResults/avalonia-checks-linux.log
